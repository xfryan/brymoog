<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brymoog</title>
<style>
:root{--bg:#faf9f5;--side:#f1efe8;--tx:#1f1e1d;--mut:#6b6a66;--bd:#d9d7cf;--ac:#185FA5;--acbg:#E6F1FB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--side:#262524;--tx:#f1efe8;--mut:#b4b2a9;--bd:#444441;--ac:#85B7EB;--acbg:#0C447C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1e1d;--side:#262524;--tx:#f1efe8;--mut:#b4b2a9;--bd:#444441;--ac:#85B7EB;--acbg:#0C447C;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,sans-serif;display:flex;overflow:hidden}
nav{width:132px;flex:none;background:var(--side);border-right:1px solid var(--bd);padding:14px 10px;display:flex;flex-direction:column;gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px))}
nav .brand{font-size:12px;letter-spacing:.12em;color:var(--mut);font-weight:600;padding:4px 6px 8px}
nav button{font:inherit;text-align:left;padding:10px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--tx);cursor:pointer;line-height:1.25}
nav button small{display:block;font-size:12px;color:var(--mut)}
nav button.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
nav button.on small{color:var(--ac)}
nav button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.stage{flex:1;min-width:0;position:relative}
[hidden]{display:none!important}
.about{margin-top:auto;font-size:14px;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:22px 24px;max-width:520px;width:100%;line-height:1.55}
.mbox h2{font-size:20px;font-weight:600;letter-spacing:.06em;margin:0 0 10px}
.mbox p{margin:0 0 12px;font-size:15px}
.mbox a{color:var(--ac);font-weight:600}
.mbox button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;margin-top:6px}
@media (max-width:640px){.about{margin-top:0;margin-left:auto}}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
@media (max-width:640px){body{flex-direction:column}nav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--bd);padding:8px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}nav .brand{display:none}}
html:root:not(#_){--bg:#1f1e1d;--side:#262524;--tx:#f1efe8;--mut:#b4b2a9;--bd:#444441;--ac:#85B7EB;--acbg:#0C447C;color-scheme:dark}
</style>
</head>
<body>
<nav aria-label="Sintetizadores">
  <div class="brand">BRYMOOG</div>
  <button type="button" data-id="b1" class="on">B-MOOG 1<small>1 oscilador, LFO</small></button>
  <button type="button" data-id="b3">B-MOOG 3<small>v1.0 · 3 osciladores</small></button>
  <button type="button" data-id="b5">B-MOOG 5<small>v1.0 · polifónico y ritmos</small></button>
  <button type="button" data-id="b7">B-MOOG 7<small>v1.0 · tracks y canciones</small></button>
  <button type="button" data-id="b9">B-MOOG 9<small>v1.1 · componer con teclado MIDI</small></button>
  <button type="button" class="about" id="aboutbtn">Acerca de</button>
</nav>
<div class="modal" id="about" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="abt">
  <h2 id="abt">BRYMOOG</h2>
  <p>Sintetizadores para entender cómo se arma un sonido, una pieza a la vez, siguiendo el panel del Minimoog.</p>
  <p>Para conocer el panel del Minimoog Model D control por control: <a href="https://claude.ai/artifact/9H9R9Y5uCn8RpeyTowJAdB" target="_blank" rel="noopener">Leer un Minimoog</a></p>
  <button type="button" id="aboutx">Cerrar</button>
</div></div>
<div class="stage" id="stage"></div>
<script>
const FILES={b1:"b-moog-1.html",b3:"b-moog-3.html",b5:"b-moog-5.html",b7:"b-moog-7.html",b9:"b-moog-9/index.html"},NAMES={b1:"B-MOOG 1",b3:"B-MOOG 3",b5:"B-MOOG 5",b7:"B-MOOG 7",b9:"B-MOOG 9"};
const frames={};let active=null;
async function load(id){const f=document.createElement("iframe");f.title=NAMES[id];f.setAttribute("allow","autoplay; midi");frames[id]=f;document.getElementById("stage").appendChild(f);
 // El B-MOOG 9 es una carpeta con módulos: se carga con src, porque con srcdoc los módulos no cargan.
 if(FILES[id].includes("/")){f.addEventListener("load",()=>{if(active===id)try{f.contentWindow.focus();}catch(e){}});f.src=FILES[id];return;}
 try{const r=await fetch(FILES[id]);f.srcdoc=await r.text();}catch(e){f.srcdoc='<p style="font-family:system-ui;padding:20px">No se pudo cargar '+NAMES[id]+'. Recarga la página.</p>';}
 f.addEventListener("load",()=>{if(active===id)try{f.contentWindow.focus();}catch(e){}});}
function show(id){
 if(active&&frames[active]&&active!==id){try{frames[active].contentWindow.allOff&&frames[active].contentWindow.allOff();}catch(e){}frames[active].hidden=true;}
 if(!frames[id])load(id);
 frames[id].hidden=false;active=id;
 document.querySelectorAll("nav button[data-id]").forEach(b=>b.classList.toggle("on",b.dataset.id===id));
 try{frames[id].contentWindow.focus();}catch(e){}
 try{history.replaceState(null,"","#"+id);}catch(e){}
}
document.querySelectorAll("nav button[data-id]").forEach(b=>b.addEventListener("click",()=>show(b.dataset.id)));
const ab=document.getElementById("about");
const abOpen=v=>{ab.hidden=!v;document.getElementById(v?"aboutx":"aboutbtn").focus();};
document.getElementById("aboutbtn").addEventListener("click",()=>abOpen(true));
document.getElementById("aboutx").addEventListener("click",()=>abOpen(false));
ab.addEventListener("click",e=>{if(e.target===ab)abOpen(false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!ab.hidden)abOpen(false);});
show(["#b3","#b5","#b7","#b9"].includes(location.hash)?location.hash.slice(1):"b1");
</script>
</body>
</html>
